<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="メモをくわえて飛んでいる鵜のマスコット">
  <title>メモう（案C・飛んでいる）</title>
  <!-- 全身版・アイコン版と同じ色。グラデーション・影・光沢は使わない -->
  <!-- 奥の翼 #16232f / 胴・首・頭 #1e435f / 手前の翼 #2a5b82 / くちばし・手縄・足 #9a6238 -->

  <!-- 奥の翼（打ち上げ） -->
  <path d="M86 110 Q58 70 46 34 Q84 64 102 106 Z" fill="#16232f"/>

  <!-- 後ろへ流す足 -->
  <path d="M62 124 L42 132" stroke="#9a6238" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M64 129 L47 138" stroke="#9a6238" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- 尾 -->
  <path d="M56 112 L18 120 L58 128 Z" fill="#1e435f"/>

  <!-- 胴 -->
  <ellipse cx="84" cy="118" rx="35" ry="15" fill="#1e435f" transform="rotate(-10 84 118)"/>

  <!-- 首（前へまっすぐ伸ばす。飛ぶ鵜の特徴） -->
  <path d="M110 104 C122 100 134 96 144 91 L149 101 C138 106 125 110 113 115 Z" fill="#1e435f"/>

  <!-- 頭 -->
  <ellipse cx="150" cy="93" rx="11.5" ry="9.5" fill="#1e435f"/>

  <!-- くちばし -->
  <path d="M159 89 L183 86 L181 94 L159 97 Z" fill="#9a6238"/>
  <path d="M183 86 L181 94 L188 93 Z" fill="#8a5541"/>

  <!-- 目（ハイライトなし） -->
  <circle cx="153" cy="90" r="3.8" fill="#f6f5f2"/>
  <circle cx="154" cy="90" r="1.8" fill="#16232f"/>

  <!-- 鵜飼の手縄 -->
  <path d="M121 107 q6 3 12 -4" stroke="#9a6238" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 手前の翼（打ち下ろし） -->
  <path d="M78 124 Q56 152 44 178 Q78 152 92 128 Z" fill="#2a5b82"/>

  <!-- くわえているメモ用紙 -->
  <g transform="rotate(-12 182 104)">
    <rect x="170" y="93" width="25" height="21" rx="2" fill="#f6f5f2" stroke="#8a5541" stroke-width="3"/>
    <path d="M176 101 H189" stroke="#8a5541" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M176 108 H184" stroke="#8a5541" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
