  .geo-result-badge.pass { background: #e6f4ea; color: #2e7d46; }
  .geo-result-badge.fail { background: #fbe9e7; color: #c0392b; }
  .geo-result-badge.perfect { background: #fdf1d6; color: #8a6d1d; }

<div data-site-header data-prefix="../"></div>

<section class="page-hero" style="padding-bottom:0;">

<section>
  <div class="wrap geo-wrap">
    <div id="geo-no-data" class="geo-card" style="display:none;text-align:center;">
      <p>準備中です。写真データが揃い次第、遊べるようになります。</p>
    </div>

    <div id="geo-start" class="geo-card geo-start">
      <p style="font-size:1.05rem;margin-bottom:20px;">大洲の街、どれだけ知っていますか？<br>写真を見て、地図上でクリックして場所を予想してください。<br>実際の撮影場所から半径30m以内なら正解です。</p>
      <button id="geo-start-btn" class="cta-btn" style="background:var(--color-brand);border:none;cursor:pointer;font-size:1rem;">はじめる</button>
    </div>

    <div id="geo-game" style="display:none;">
      <p class="geo-progress"><span id="geo-progress-text"></span></p>
      <div class="geo-card">
        <div class="geo-photo-wrap">
          <img id="geo-photo" src="" alt="">
        </div>
        <div id="geo-map"></div>
        <p class="geo-hint">地図をクリックして、この写真が撮影された場所にピンを置いてください。</p>
        <div class="geo-guess-btn-wrap">
          <button id="geo-guess-btn" class="cta-btn" style="background:var(--color-brand);border:none;cursor:pointer;" disabled>この場所で決定</button>
        </div>
        <div class="geo-round-result" id="geo-round-result">
          <p class="geo-round-badge" id="geo-round-badge"></p>
          <p id="geo-round-distance" style="color:var(--color-text-muted);margin:0;"></p>
        </div>
        <div class="geo-next" id="geo-next-wrap">
          <button id="geo-next-btn" class="cta-btn" style="background:var(--color-brand);border:none;cursor:pointer;">次へ →</button>
        </div>
      </div>
    </div>

    <div id="geo-result" class="geo-card geo-result" style="display:none;">
      <p id="geo-final-badge" class="geo-result-badge"></p>
      <p>あなたの正解数</p>
      <p class="geo-result-score"><span id="geo-score"></span></p>
      <p id="geo-final-comment" style="color:var(--color-text-muted);margin-bottom:20px;"></p>
      <button id="geo-retry-btn" class="cta-btn" style="background:var(--color-brand);border:none;cursor:pointer;">もう一度挑戦する</button>
