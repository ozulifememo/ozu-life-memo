  </div>
</section>

<section>
  <div class="wrap">
    <div class="news-cards" id="highlights-body"></div>
    <p class="stub-note" id="highlights-empty" style="display:none;">
      まだ「おすすめ」に選ばれた記事はありません。記事を読んで「これは良かった」と思うものがあれば、

<script src="../assets/js/site-chrome.js"></script>
<script src="../assets/js/news-data.js"></script>
<script src="../assets/js/tag-colors.js"></script>
<script>
  (function renderHighlights() {
    const body = document.getElementById("highlights-body");
    const empty = document.getElementById("highlights-empty");
    if (!body || typeof OZU_NEWS === "undefined") return;

    const picked = OZU_NEWS.filter((item) => item.pick).sort((a, b) => (a.date < b.date ? 1 : -1));

    if (picked.length === 0) {
      empty.style.display = "block";
      return;
    }

    body.innerHTML = picked
      .map((item) => {
        const tags = (item.tags || [])
          .map((t) => `<span class="card-tag" style="--tag-c:${ozuTagColorVar(t)}">${t}</span>`)
          .join("");
        return `
      <div class="news-card" data-category="${item.category}" style="--tag-c:${ozuCategoryColorVar(item.category)}">
        <span class="news-date">${item.date.replace(/-/g, "/")}</span>
        <a class="news-title" href="../eachnews/${item.slug}.html">${item.title}</a>
        <span class="news-source">${item.pickNote || item.source}</span>
        <div class="card-tags-row">${tags}</div>
      </div>`;
      })
      .join("");
  })();
</script>
<script src="../assets/js/main.js"></script>
