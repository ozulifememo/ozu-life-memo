<script>
  (function renderHomePicks() {
    const wrap = document.getElementById("home-pick-cards");
    if (!wrap || typeof OZU_NEWS === "undefined") return;

    const picks = OZU_NEWS.filter((item) => item.pick).sort((a, b) => (a.date < b.date ? 1 : -1));

    wrap.innerHTML = picks
      .map(
        (item) => `
      <a class="pick-card" href="eachnews/${item.slug}.html">
        <span class="pick-badge">${OZU_CATEGORY_LABELS[item.category]}</span>
        <h3>${item.title}</h3>
        <p>${item.pickNote || ""}</p>
      </a>`
      )
      .join("");
  })();

  (function renderHomeLatestNews() {
    const wrap = document.getElementById("home-latest-news");
    const tabs = document.querySelectorAll(".hero, .latest-news .news-tab");
    if (!wrap || typeof OZU_NEWS === "undefined") return;

    const sorted = [...OZU_NEWS].sort((a, b) => (a.date < b.date ? 1 : -1));

    function render(category) {
      const list = category === "all" ? sorted : sorted.filter((i) => i.category === category);
      wrap.innerHTML = list
        .slice(0, 9)
        .map(
          (item) => `
        <div class="news-card">
          <span class="news-date">${item.date.replace(/-/g, "/")}</span>
          <a class="news-title" href="eachnews/${item.slug}.html">${item.title}</a>
          <span class="news-source">${item.source}</span>
        </div>`
        )
        .join("");
    }

    render("all");

    document.querySelectorAll(".latest-news .news-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".latest-news .news-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        render(tab.dataset.category);
      });
    });
  })();
</script>
