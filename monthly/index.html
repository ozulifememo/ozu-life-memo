<script>
  (function renderMonthlyList() {
    const list = document.getElementById("monthly-list");
    if (!list || typeof OZU_MONTHLY_NOTES === "undefined") return;

    const monthLabel = (m) => {
      const [y, mo] = m.split("-");
      return `${y}年${parseInt(mo, 10)}月`;
    };

    list.innerHTML = OZU_MONTHLY_NOTES.map((entry) => {
      // 月内はほとんど同じ掲載日なので、出典が新しい順を第2キーにする
      const articles = OZU_NEWS.filter((item) => item.date.startsWith(entry.month)).sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        const as = a.sourceDate || "";
        const bs = b.sourceDate || "";
        if (as !== bs) return as < bs ? 1 : -1;
        return 0;
      });

      const articleItems = articles
        .map(
          (item) => `
        <li data-category="${item.category}">
          <span class="rdate">${item.date.slice(5).replace("-", "/")}</span>
          <span class="rtag">[${OZU_CATEGORY_LABELS[item.category]}]</span>
          <a href="../eachnews/${item.slug}.html">${item.title}</a>
        </li>`
        )
        .join("");

      return `
      <article class="monthly-card">
        <h2>${monthLabel(entry.month)}</h2>
        <p class="monthly-headline">${entry.headline}</p>
        <p class="monthly-comment">${entry.comment}</p>
        <ul>${articleItems}</ul>
      </article>`;
    }).join("");
  })();
</script>
