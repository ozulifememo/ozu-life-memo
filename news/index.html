<head>

<meta property="og:url" content="https://ozulifememo.github.io/ozu-life-memo/news/">
<meta property="og:image" content="https://ozulifememo.github.io/ozu-life-memo/assets/img/real-photo-9.jpg">

<link rel="canonical" href="https://ozulifememo.github.io/ozu-life-memo/news/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "大洲ノート ｜ OZU LIFE MEMO",
  "url": "https://ozulifememo.github.io/ozu-life-memo/news/",
  "description": "市役所の発表やSNS、noteの記事から拾い上げた大洲の話題を、3つの視点で整理しています。",

}
</script>
</head>
<body>

<div data-site-header data-prefix="../"></div>

<section class="page-hero" style="padding-bottom:0;">
  <div class="wrap">
    <h1>大洲ノート</h1>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="news-categories">
      <div class="news-category-card">
        <h3>1. [大洲のいま]</h3>
        <p>Yahoo!ニュースやX、市役所の発表などから拾い上げた現在進行形の街の動き。</p>
      </div>
      <div class="news-category-card">
        <h3>2. [暮らしと防衛]</h3>
        <p>市役所などの公的情報の中から良いと思ったものを厳選し、翻訳します。</p>
      </div>
      <div class="news-category-card">
        <h3>3. [大洲の視点]</h3>
        <p>noteの長文記事や市の施策など、僕なりの本音と考察を乗せて読み解くコラム。</p>
      </div>
    </div>

    <div class="news-layout">
      <aside class="news-sidebar">
        <div class="sidebar-filter-group">
          <p class="tag-filter-label">カテゴリ</p>
          <div class="news-tabs">
            <button class="news-tab active" data-category="all">全般</button>
            <button class="news-tab" data-category="ima">大洲のいま</button>
            <button class="news-tab" data-category="kurashi">暮らしと防衛</button>
            <button class="news-tab" data-category="shiten">大洲の視点</button>
          </div>
        </div>
        <div class="sidebar-filter-group">
          <p class="tag-filter-label">テーマで絞り込む</p>
          <div class="tag-filter" id="tag-filter"></div>
          <a href="../data/" class="tag-chip" style="display:inline-block;margin-top:8px;text-decoration:none;">→ タグをクラウドで見る</a>
        </div>
        <div class="sidebar-filter-group">
          <p class="tag-filter-label">情報源で絞り込む</p>
          <div class="tag-filter" id="source-filter"></div>
        </div>
      </aside>

      <div class="news-main">
        <div class="news-cards" id="news-table-body"></div>
      </div>
    </div>
  </div>
</section>

<div data-site-footer></div>

<div data-site-modal></div>

<script src="../assets/js/site-chrome.js"></script>
<script src="../assets/js/news-data.js"></script>
<script src="../assets/js/tag-colors.js"></script>
<script>
  (function renderNewsTable() {
    const body = document.getElementById("news-table-body");
    if (!body || typeof OZU_NEWS === "undefined") return;

    const sorted = [...OZU_NEWS].sort((a, b) => (a.date < b.date ? 1 : -1));

    body.innerHTML = sorted
      .map((item) => {
        const sourceType = typeof ozuSourceType === "function" ? ozuSourceType(item.source) : "その他";
        const tags = (item.tags || [])
          .map((t) => `<span class="card-tag" style="--tag-c:${ozuTagColorVar(t)}">${t}</span>`)
          .join("");
        return `
      <div class="news-card" data-category="${item.category}" data-tags="${(item.tags || []).join(",")}" data-source-type="${sourceType}" style="--tag-c:${ozuCategoryColorVar(item.category)}">
        <span class="news-date">${item.date.replace(/-/g, "/")}</span>
        <a class="news-title" href="../eachnews/${item.slug}.html">${item.title}</a>
        <span class="news-source">${item.source}</span>
        <div class="card-tags-row">${tags}</div>
      </div>`;
      })
      .join("");
  })();

  (function renderTagFilter() {
    const wrap = document.getElementById("tag-filter");
    if (!wrap || typeof OZU_TAGS === "undefined") return;

    const chips = ['<button class="tag-chip active" data-tag="all">すべて</button>'].concat(
      OZU_TAGS.map((tag) => `<button class="tag-chip" data-tag="${tag}">${tag}</button>`)
    );
    wrap.innerHTML = chips.join("");
  })();

  (function renderSourceFilter() {
    const wrap = document.getElementById("source-filter");
    if (!wrap || typeof OZU_SOURCE_TYPES === "undefined") return;

    const chips = ['<button class="tag-chip active" data-source-type="all">すべて</button>'].concat(
      OZU_SOURCE_TYPES.map((t) => `<button class="tag-chip" data-source-type="${t}">${t}</button>`)
    );
    wrap.innerHTML = chips.join("");
  })();
</script>
<script src="../assets/js/main.js"></script>
<script data-goatcounter="https://ozulifememo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
